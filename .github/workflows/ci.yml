name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Prettier lint has large pre-existing debt; build is the ship gate.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
      - run: npm run build
